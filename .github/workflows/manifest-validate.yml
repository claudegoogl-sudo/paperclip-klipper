name: Plugin manifest validation (release gate)

# PLA-376 — release-time check that runs the host plugin-manifest
# validator against the built dist/manifest.js BEFORE a tarball can be
# packed or published. Mirrors the gate at
# packages/plugins/create-paperclip-plugin/src/index.ts (scaffold).

on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'tsconfig.json'
      - 'vitest.config.ts'
      - 'esbuild.config.mjs'
      - 'rollup.config.mjs'
      - 'scripts/validate-manifest.mjs'
      - 'scripts/check-manifest-version.mjs'
      - 'scripts/check-source-hygiene.mjs'
      - '.paperclip-sdk/**'
      - '.github/workflows/manifest-validate.yml'
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'tests/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'tsconfig.json'
      - 'vitest.config.ts'
      - 'esbuild.config.mjs'
      - 'rollup.config.mjs'
      - 'scripts/validate-manifest.mjs'
      - 'scripts/check-manifest-version.mjs'
      - 'scripts/check-source-hygiene.mjs'
      - '.paperclip-sdk/**'
      - '.github/workflows/manifest-validate.yml'

jobs:
  validate-manifest:
    name: validate dist/manifest.js against pluginManifestV1Schema
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Check source hygiene (no internal ticket ids / namespace strings)
        run: pnpm run check:source-hygiene
      - name: Typecheck
        run: pnpm run typecheck
      - name: Build manifest (and worker)
        run: pnpm run build
      - name: Unit tests (full suite)
        run: pnpm exec vitest run --config ./vitest.config.ts
      - name: Validate built manifest
        run: pnpm run validate:manifest
      - name: Check manifest.version == package.json.version
        run: pnpm run check:manifest-version
      # Also covered by "Unit tests" above; named separately so the packaging
      # gate stays legible in the checks list if the suite changes shape.
      - name: Assert the packed tarball ships no sourcemaps
        run: pnpm exec vitest run --config ./vitest.config.ts tests/no-published-sourcemaps.spec.ts
