# pnpm settings — pnpm 10+ no longer reads the `pnpm` field in package.json.
# See https://pnpm.io/settings for the new home of each setting.
# `packages` must be declared even for single-package repos that only use this file for settings.
packages:
  - '.'

# esbuild ships a postinstall that probes platform binaries. Trusted, allow.
onlyBuiltDependencies:
  - esbuild

# Pin `@paperclipai/shared` to the same vendored tarball as
# `@paperclipai/plugin-sdk` (its transitive dependency), so installs resolve
# byte-identically from `.paperclip-sdk/` without relying on registry state.
overrides:
  '@paperclipai/shared': 'file:.paperclip-sdk/paperclipai-shared-2026.923.1-fork51.tgz'
